# Layer 1 of the brakes: the same umbrella check the agent and the pre-commit hook run.
# Branch protection requires the job named `check` (scripts/github/bootstrap.sh).
# Install your stack's toolchain and dependencies before the check step.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check (scripts/check.py)
        run: python scripts/check.py
